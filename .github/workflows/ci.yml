name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Regra de ouro #2: CI verde obrigatório — nada de merge com pipeline vermelho.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (Next.js)
        run: pnpm build

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # SCA: falha em vulnerabilidade alta/crítica nas deps de produção.
      # (Dependabot — .github/dependabot.yml — abre PRs de atualização.)
      - name: Audit (prod, high+)
        run: pnpm audit --prod --audit-level=high
